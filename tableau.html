<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Métré du chantier</title>
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--mut:#667085;--card:#fff;--line:#e2e5ea;--acc:#1f3a5f;--acc2:#2f6fb0;--ok:#1e7b4a;--r:10px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--fg:#e6e9ef;--mut:#9aa3b2;--card:#1d2128;--line:#2c323c;--acc:#26466e;--acc2:#4f8fd6;--ok:#4cc38a}}
:root[data-theme="dark"]{--bg:#14171c;--fg:#e6e9ef;--mut:#9aa3b2;--card:#1d2128;--line:#2c323c;--acc:#26466e;--acc2:#4f8fd6;--ok:#4cc38a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);font-size:16px}
header{position:sticky;top:0;background:var(--acc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1 1 auto}
main{padding:16px;max-width:900px;margin:auto}
button,select,input{font:inherit}
.btn{background:var(--acc2);color:#fff;border:0;border-radius:var(--r);padding:10px 14px;cursor:pointer;min-height:44px}
.btn.sec{background:transparent;color:var(--acc2);border:1px solid var(--acc2)}
.btn.danger{background:#b42318}
.btn.small{min-height:34px;padding:6px 10px;font-size:14px}
.hdr{background:transparent;color:#fff;border:1px solid #fff;border-radius:var(--r);padding:6px 10px;min-height:36px;font-size:14px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);min-height:44px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px}
.ouv{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:48px}
.ouv:active{background:var(--line)}
.tag{font-size:12px;color:var(--mut);white-space:nowrap}
.lotbloc h3{font-size:15px;margin:14px 0 6px;color:var(--acc2)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.num{text-align:right;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.sheet{background:var(--card);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.muted{color:var(--mut);font-size:14px}
.calc{font-size:17px;font-weight:600;margin:14px 0 4px;color:var(--acc2);min-height:24px}
.ok{background:#e7f6ee;color:#14532d;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px}
.hidden{display:none!important}
body[data-page="tableau"] .hdr{display:none}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
</style>
</head>
<body data-page="tableau">

<header>
  <h1 id="titre">Métré Atelier 2M</h1>
  <button class="hdr" id="btnChantiers">Chantiers</button>
  <button class="hdr" id="btnReglages">Réglages</button>
</header>

<main>
  <!-- Liste des chantiers -->
  <section id="vChantiers">
    <div class="card">
      <label for="nomChantier">Nouveau chantier</label>
      <div class="row">
        <input id="nomChantier" placeholder="Ex : Bourdet – Malemort">
        <button class="btn" id="btnNouveau">Créer</button>
      </div>
    </div>
    <div id="listeChantiers"></div>
  </section>

  <!-- Écran 1 : saisie (choix du lot et des ouvrages) -->
  <section id="vMetre" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button class="btn" id="ongletSaisie">Saisie</button>
      <button class="btn sec" id="ongletTableau">Métré du chantier (<span id="nbLignes">0</span>)</button>
    </div>
    <div class="card">
      <label for="selLot">1. Lot</label>
      <select id="selLot"></select>
      <label for="recherche">2. Ouvrage (dans ce lot)</label>
      <input id="recherche" placeholder="Rechercher…">
    </div>
    <div class="card" id="listeOuvrages" style="padding:0;overflow:hidden"></div>
  </section>

  <!-- Écran 2 : métré validé du chantier -->
  <section id="vTableau" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <button class="btn sec" id="ongletSaisie2">Saisie</button>
      <button class="btn" id="ongletTableau2">Métré du chantier (<span id="nbLignes2">0</span>)</button>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <strong>Lignes validées</strong>
        <button class="btn small sec" id="btnCsv">Exporter CSV</button>
      </div>
      <div id="tableMetre" style="overflow-x:auto;margin-top:8px"></div>
    </div>
  </section>

  <!-- Réglages -->
  <section id="vReglages" class="hidden">
    <div class="card">
      <label for="urlScript">Adresse du script (se termine par /exec)</label>
      <input id="urlScript" placeholder="https://script.google.com/macros/s/…/exec">
      <label for="jeton">Jeton secret</label>
      <input id="jeton" type="password" autocomplete="off">
      <div class="row" style="margin-top:12px">
        <button class="btn" id="btnSauverReglages">Enregistrer</button>
        <button class="btn sec" id="btnEnvoiBib">Envoyer la bibliothèque sur Drive</button>
      </div>
      <p class="muted">Ces réglages restent sur cet appareil. Le jeton n'est jamais affiché ailleurs.</p>
    </div>
  </section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script src="app.js"></script>
</body>
</html>
